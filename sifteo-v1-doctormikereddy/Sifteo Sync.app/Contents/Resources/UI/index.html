    <script type="text/template" id="login-template">
      <div id="login-dialog" class="modal hide fade in">
        <div class="modal-body">
          <img class="emblem" src="img/emblem.png">
          <div class="tip hide">
            <p class="text"><span class="strong">Hello!</span> <span class="help-text"></span></p>
            <img class="cube-buddy suli" src="img/cube-buddies/suli.png"/>
          </div>
          <form>
            <fieldset>
              <div class="controls input-prepend row-fluid">
                <span class="add-on"><i class="icon-user"></i></span><input class="span11" type="text" name="username" placeholder="Email">
              </div>
              <div class="controls input-prepend row-fluid">
                <span class="add-on"><i class="icon-asterisk"></i></span><input class="span11" type="password" name="password" placeholder="Password">
              </div>
            </fieldset>
            <div>
              <a href="#register" class="pull-left">Create an account &raquo;</a>

              <p class="dlg-status pull-right"></p>
            </div>
          </form>
        </div>
      </div>
    </script>

    <script type="text/template" id="app-icon-template">

    <!-- Device Templates -->
    <script type="text/template" id="base-device-template">
      <div class="wizard">
        <form class="form-horizontal">
          <div class="wizard-body">
            <div class="control-group">
              <label class="control-label" for="dev-form-name">Name</label>
              <div class="controls">
                <input type="text" name="name" value="{{name}}" id="dev-form-name" class="input-xlarge">
              </div>
            </div>
            <ul class="nav nav-tabs">
              <li class="active"><a href="#device-apps" data-toggle="tab">Games</a></li>
              <li><a href="#device-cubes" data-toggle="tab">Cubes</a></li>
              <li><a href="#device-info" data-toggle="tab">Info</a></li>
            </ul>
            <div class="tab-content">
            </div>
          </div>
          <div class="wizard-footer">
            <a href="#" class="btn cmd-close">Close</a>
          </div>
        </form>
      </div>
    </script>
    
    <script type="text/template" id="base-device-info-tab-template">
      <div id="device-info" class="tab-pane">
        <dl class="dl-horizontal">
          <dt>Firmware</dt>
          <dd><span class="val-firmware-version">{{firmwareVersion}}</span></dd>
          <dt>Launcher</dt>
          <dd><span class="val-launcher-version"></span></dd>
          <dt>Storage</dt>
          <dd><span class="val-storage-available">{{formattedBytesAvailable}}</span> MB free out of <span class="val-storage-size">{{formattedSize}}</span> MB</dd>
        </dl>
      </div>
    </script>
    
    <script type="text/template" id="base-device-apps-tab-template">
      <div id="device-apps" class="tab-pane active">
        <dl class="dl-horizontal device-apps">
        </dl>
      </div>
    </script>
    
    <script type="text/template" id="base-device-app-item-template">
      <dt><!--<img src="unknown.png">--></dt>
      <dd>
        <div class="info">
          <span class="val-title"><strong>{{title}}</strong></span> <span class="val-version">{{version}}</span><br/>
          <span class="val-id"><small>{{id}}</small></span> - <span class="val-size"><small>{{formattedSize}}</small></span> <span class="val-size-unit"><small>{{formattedSizeUnit}}</small></span><br/>
        </div>
        <div class="action">
          <span><a href="#" class="cmd-uninstall">Remove</a></span>
        </div>
      </dd>
    </script>
    
    <script type="text/template" id="base-device-cubes-tab-template">
      <div id="device-cubes" class="tab-pane">
        <p><span class="val-pairings-count">{{count}}</span> cubes paired</p>
        <!--
        <ol id="cube-list" class="x-unstyled">
        </ol>
        -->
        <a href="#" class="btn btn-small btn-warning btn-block cmd-unpair">Unpair All</a>
      </div>
    </script>
    
    <script type="text/template" id="base-device-cube-item-template">
      <li id="device-cubes-entry">
        <span class="val-hwid">{{hwid}}</span>
      </li>
    </script>
    
    
    <!-- account templates -->
    <script type="text/template" id="account-template">
      <div class="wizard">
        <form id="account-form" class="form-horizontal">
          <div class="wizard-body">
          </div>
          <div class="wizard-footer">
            <a href="#" class="btn btn-inverse pull-left cmd-logout">Log Out</a>
            <button type="submit" class="btn btn-primary next">Submit</button>
          </div>
        </form>
      </div>
    </script>
    
    <script type="text/template" id="account-step-details-template">
      <div>
          <div class="tabbable">
            <ul class="nav nav-tabs">
              <li class="active"><a href="#account-tab-profile" data-toggle="tab">Profile</a></li>
              <li class=""><a href="#account-tab-password" data-toggle="tab">Password</a></li>
            </ul>
            <div class="tab-content">
              <div id="account-tab-profile" class="tab-pane active">
                <div class="control-group">
                  <label class="control-label" for="acct-form-name-given-name">First Name</label>
                  <div class="controls">
                    <input type="text" name="name[given_name]" id="acct-form-name-given-name" class="input-xlarge">
                  </div>
                </div>
                <div class="control-group">
                  <label class="control-label" for="acct-form-name-family-name">Last Name</label>
                  <div class="controls">
                    <input type="text" name="name[family_name]" id="acct-form-name-family-name" class="input-xlarge">
                  </div>
                </div>
                <div class="control-group">
                  <label class="control-label" for="acct-form-email">Email</label>
                  <div class="controls">
                    <input type="text" name="email" id="acct-form-email" class="input-xlarge">
                  </div>
                </div>
                <div class="control-group">
                  <div class="controls">
                    <label class="checkbox">
                      <input type="checkbox" name="subscribe"> Send me Sifteo news
                    </label>
                  </div>
                </div>
              </div>
              <div id="account-tab-password" class="tab-pane">
                <div class="control-group">
                  <label class="control-label" for="acct-form-password">Current Password</label>
                  <div class="controls">
                    <input type="password" name="password" id="acct-form-password" class="input-xlarge">
                  </div>
                </div>
                <div class="control-group">
                  <label class="control-label" for="acct-form-new-password">New Password</label>
                  <div class="controls">
                    <input type="password" name="new_password" id="acct-form-new-password" class="input-xlarge">
                  </div>
                </div>
                <div class="control-group">
                  <label class="control-label" for="acct-form-new-password-confirmation">Confirm Password</label>
                  <div class="controls">
                    <input type="password" name="new_password_confirmation" id="acct-form-new-password-confirmation" class="input-xlarge">
                  </div>
                </div>
              </div>
            </div>
          </div>
      </div>
    </script>
    
    <script type="text/template" id="account-step-submit-template">
      <div class="spinner align-center">
        <img src="images/roller.gif"/>
        <p>{{message}}</p>
      </div>
    </script>
    
    <script type="text/template" id="account-step-done-template">
      <div>
        <p></p>
      </div>
    </script>

        <div class="info">
          <p class="title">Oops. There was a problem updating your account.</p>
          <p class="message"></p>
        </div>
      </div>
    </script>

          </div>
        </label>
      </div>
    </script>
    
    <script type="text/template" id="shop-step-billing-address-template">
      <div>
        <div class="controls controls-row">
          <label for="ba-form-name-given-name" class="control-label span2">First Name</label>
          <label for="ba-form-name-middle-name" class="control-label span1">MI</label>
          <label for="ba-form-name-family-name" class="control-label span3">Last Name</label>
        </div>
        <div class="controls controls-row">
          <input id="ba-form-name-given-name" type="text" name="name[given_name]" class="span2"><input id="ba-form-name-middle-name" type="text" name="name[middle_name]" class="span1"><input id="ba-form-name-family-name" type="text" name="name[family_name]" class="span3">
        </div>
        <div class="controls">
          <label for="ba-form-address-street-address" class="control-label span6">Address</label>
        </div>
        <div class="controls">
          <input id="ba-form-address-street-address" type="text" name="address[street_address]" class="span6">
          <input id="ba-form-address-street-address-ext" type="text" name="address[street_address_ext]" class="span6">
        </div>
        <div class="controls controls-row">
          <label for="ba-form-address-locality" class="control-label span3">City</label>
          <label for="ba-form-address-region" class="control-label span1">State</label>
          <label for="ba-form-address-postal-code" class="control-label span2">Zip Code</label>
        </div>
        <div class="controls controls-row">
          <input id="ba-form-address-locality" type="text" name="address[locality]" class="span3"><input id="ba-form-address-region" type="text" name="address[region]" class="span1"><input id="ba-form-address-postal-code" type="text" name="address[postal_code]" class="span2">
        </div>
        <div class="controls controls-row">
          <label for="ba-address-country" class="control-label span4">Country</label>
          <label for="ba-form-phone-number" class="control-label span2">Phone</label>
        </div>
        <div class="controls controls-row">
          <select id="ba-address-country" name="address[country]" class="span4">
            <option value="US">United States</option>
            <option value="CA">Canada</option>
          </select><input type="text" name="phone_number" id="ba-form-phone-number" class="span2">
        </div>
      </div>
    </script>
    
    <script type="text/template" id="shop-step-credit-card-template">
      <div>
        <div class="controls">
          <label for="cc-form-name" class="control-label span6">Cardholder&apos;s Name</label>
        </div>
        <div class="controls">
          <input id="cc-form-name" type="text" name="credit_card[name]" class="span6">
        </div>
        <div class="controls controls-row">
          <label for="cc-form-number" class="control-label span5">Credit Card Number</label>
          <label for="cc-form-csc" class="control-label span1">CSC</label>
        </div>
        <div class="controls controls-row">
          <input id="cc-form-number" type="text" name="credit_card[number]" class="span5"><input id="cc-form-csc" type="text" name="credit_card[csc]" class="span1">
        </div>
        <div class="controls">
          <label for="cc-form-expiration-month" class="control-label span6">Expiration Date</label>
        </div>
        <div class="controls controls-row">
          <select id="cc-form-expiration-month" name="credit_card[expiration_date[month]]" class="span1">
            <option value="01">01</option>
            <option value="02">02</option>
            <option value="03">03</option>
            <option value="04">04</option>
            <option value="05">05</option>
            <option value="06">06</option>
            <option value="07">07</option>
            <option value="08">08</option>
            <option value="09">09</option>
            <option value="10">10</option>
            <option value="11">11</option>
            <option value="12">12</option>
          </select>
          <select name="credit_card[expiration_date[year]]" id="cc-form-expiration-year" class="span2">
            <option value="2012">2012</option>
            <option value="2013">2013</option>
            <option value="2014">2014</option>
            <option value="2015">2015</option>
            <option value="2016">2016</option>
            <option value="2017">2017</option>
            <option value="2018">2018</option>
            <option value="2019">2019</option>
          </select>
          <span class="credit-card-types span3">
            <img src="img/visa.png">
            <img src="img/mastercard.png">
          </span>
        </div>
      </div>
    </script>
    
    <script type="text/template" id="shop-step-calculate-template">
      <div class="spinner align-center">
        <img src="images/roller.gif"/>
        <p>{{message}}</p>
      </div>
    </script>
    
    <script type="text/template" id="shop-step-invoice-template">
      <div class="invoice">
        <h4>Confirm Your Order</h4>
        <div class="order">
          <div class="items">
          </div>
          <div class="tax">
            <h5>Sales Tax (<span class="rate"></span>%):</h5>
            <span class="amount"></span>
          </div>
          <div class="total">
            <h5>Total:</h5>
            <span class="amount"></span>
          </div>
        </div>
        <div class="payment-method">
          <div class="credit-card">
            <h5>Credit Card</h5>
            <div>Number: <span class="number"></span></div>
            <div>Expires: <span class="expiration-month"></span>/<span class="expiration-year"></span></div>
          </div>
          <div class="billing-address">
            <h5>Billing Address</h5>
            <div><span class="given-name"></span> <span class="family-name"></span></div>
            <div><span class="street-address"></span><br/><span class="street-address-ext"></span></div>
            <div><span class="locality"></span>, <span class="region"></span> <span class="postal-code"></span></div>
            <div><span class="country"></span></div>
            <div><span class="phone-number"></span></div>
          </div>
        </div>
      </div>
    </script>
    
    <script type="text/template" id="shop-step-invoice-item-template">
      <div class="item">
        <h5 class="title">{{name}}</h5>
        <span class="price">${{price}}</span>
        <div class="quantity">quantity: {{quantity}}</div>
      </div>
    </script>
    
    <script type="text/template" id="shop-step-submit-template">
      <div class="spinner align-center">
        <img src="images/roller.gif"/>
        <p>{{message}}</p>
      </div>
    </script>
    
    <script type="text/template" id="shop-step-done-template">
      <div class="purchased align-center">
        <p></p>
      </div>
    </script>
    
    <script type="text/template" id="shop-step-error-template">
      <div class="error-step">
        <div class="icon"></div>
        <div class="info">
          <p class="title">Oops. There was a problem processing your order.</p>
          <p class="message"></p>
        </div>
      </div>
    </script>
    
    
    <!-- redeem code templates -->
    <script type="text/template" id="redeem-code-template">
      <div class="wizard">
        <form id="redeem-code-form" class="form-horizontal">
          <div class="wizard-body">
          </div>
          <div class="wizard-footer">
            <button type="submit" class="btn btn-primary next">Submit</button>
          </div>
        </form>
      </div>
    </script>
    
    <script type="text/template" id="redeem-code-step-input-template">
      <div class="redeem-code control-group">
        <label class="control-label" for="redemption-code">Code</label>
        <div class="controls">
          <input type="text" name="code" id="redemption-code" class="x-input-xlarge">
        </div>
      </div>
    </script>
    
    <script type="text/template" id="redeem-code-step-submit-template">
      <div class="spinner align-center">
        <img src="images/roller.gif"/>
        <p>{{message}}</p>
      </div>
    </script>
    
    <script type="text/template" id="redeem-code-step-done-template">
      <div>
      </div>
    </script>
    
    <script type="text/template" id="redeem-code-step-error-template">
      <div class="error-step">
        <div class="icon"></div>
        <div class="info">
          <p class="title">Failed to redeem code.</p>
          <p class="message"></p>
        </div>
      </div>
    </script>
    
    <script type="text/template" id="redeemed-for-template">
      <div class="redeemed align-center">
        <div class="icon"><img src="{{iconURL}}"></div>
        <p class="message">{{message}}</p>
      </div>
    </script>
    
    
    <!-- Generic Templates -->
    <script type="text/template" id="overlay-template">
      <div class="modal-backdrop hide" />
    </script>
    
    <script type="text/template" id="popover-overlay-template">
      <div class="popover-backdrop hide" />
    </script>
    
    <script type="text/template" id="dialog-template">
      <!-- TODO: remove `fade` and `in` classes -->
      <div id="{{id}}" class="modal hide x-fade x-in">
        <div class="modal-header">
          <a class="close" data-dismiss="modal">&times;</a>
          <h4>{{title}}</h4>
        </div>
        <div class="modal-body">
        </div>
      </div>
    </script>
    
    <script type="text/template" id="wizard-dialog-template">
      <!-- TODO: remove `fade` and `in` classes -->
      <div id="{{id}}" class="modal hide x-fade x-in">
        <div class="modal-header">
          <a class="close" data-dismiss="modal">&times;</a>
          <h4>{{title}}</h4>
        </div>
        <div class="body">
        </div>
      </div>
    </script>
    
    <script type="text/template" id="popover-template">
      <div id="{{id}}" class="popover">
        <div class="arrow"></div>
        <div class="popover-inner">
          <h3 class="popover-title">{{title}}</h3>
          <div class="popover-content">
          </div>
        </div>
      </div>
    </script>
    
    <script type="text/template" id="coach-popover-template">
      <div class="popover">
        <div class="arrow"></div>
        <div class="popover-inner">
          <div class="popover-content">
            <button class="close">&times;</button>
            {{text}}
          </div>
        </div>
      </div>
    </script>
    
    <script type="text/template" id="confirm-popover-template">
      <div class="popover">
        <div class="arrow"></div>
        <div class="popover-inner">
          <div class="popover-content">
            <button class="close">&times;</button>
            {{text}}
            <div class="actions">
              <button class="btn btn-medium cancel">No</button>
              <button class="btn btn-medium btn-primary ok">Yes</button>
            </div>
          </div>
        </div>
      </div>
    </script>
    
    <script type="text/template" id="wizard-popover-template">
      <div id="{{id}}" class="popover">
        <div class="arrow"></div>
        <div class="popover-inner">
          <h3 class="popover-title">{{title}}</h3>
          <div class="body">
          </div>
        </div>
      </div>
    </script>
    
    <script type="text/template" id="error-dialog-template">
      <div class="modal error hide fade in">
        <div class="modal-header">
          <button class="close" data-dismiss="modal">&times;</button>
          <h4>Error</h4>
        </div>
        <div class="modal-body">
          <div class="icon error"></div>
          <div class="info">
            <p class="description"></p>
            <p class="suggestion"></p>
            <p><span class="message"></span> (code: <span class="code"></span>)</p>
          </div>
        </div>
      </div>
    </script>
    
    <script type="text/template" id="space-error-dialog-template">
      <div class="modal error hide fade in">
        <div class="modal-header">
          <button class="close" data-dismiss="modal">&times;</button>
          <h4>Unable to Install Game</h4>
        </div>
        <div class="modal-body">
          <div class="icon device"><img src="img/base-connected.png" width="48" height="48"></div>
          <div class="info">
            <p class="description"></p>
            <p class="suggestion"></p>
          </div>
        </div>
      </div>
    </script>
    
  </body>
</html>
